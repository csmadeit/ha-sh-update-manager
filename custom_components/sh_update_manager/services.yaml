scan_all:
  name: Scan All Queues
  description: >-
    Scan all enabled queues for new update entities matching their rules.

start_all:
  name: Start All Queues
  description: >-
    Start processing all enabled queues that have pending updates.

stop_all:
  name: Stop All Queues
  description: >-
    Stop all currently running queues.

start_queue:
  name: Start Queue
  description: Start processing a specific named queue.
  fields:
    queue_name:
      name: Queue Name
      description: The name of the queue to start (e.g., "Z-Wave Firmware").
      required: true
      selector:
        text:

stop_queue:
  name: Stop Queue
  description: Stop a specific named queue.
  fields:
    queue_name:
      name: Queue Name
      description: The name of the queue to stop.
      required: true
      selector:
        text:

pause_queue:
  name: Pause Queue
  description: >-
    Pause a specific queue. Current update finishes but no new updates start.
  fields:
    queue_name:
      name: Queue Name
      description: The name of the queue to pause.
      required: true
      selector:
        text:

resume_queue:
  name: Resume Queue
  description: Resume a paused queue.
  fields:
    queue_name:
      name: Queue Name
      description: The name of the queue to resume.
      required: true
      selector:
        text:

skip_current:
  name: Skip Current
  description: Skip the currently installing update in a queue.
  fields:
    queue_name:
      name: Queue Name
      description: The name of the queue to skip the current item in.
      required: true
      selector:
        text:

clear_queue:
  name: Clear Queue
  description: >-
    Clear all items from a specific queue and reset its counters.
  fields:
    queue_name:
      name: Queue Name
      description: The name of the queue to clear.
      required: true
      selector:
        text:
